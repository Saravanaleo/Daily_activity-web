<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Activities</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Daily Activities</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Enter a new activity..." autocomplete="off">
            <button id="addBtn">Add Task</button>
        </div>

        <div class="tasks-wrapper">
            <div class="task-section">
                <h2>Pending Tasks <span id="pendingCount" class="badge">0</span></h2>
                <ul id="pendingList" class="task-list"></ul>
            </div>

            <div class="task-section">
                <h2>Completed Tasks <span id="completedCount" class="badge completed-badge">0</span></h2>
                <ul id="completedList" class="task-list"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
